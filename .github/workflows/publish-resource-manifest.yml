name: Publish signed resource manifest

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful resource-pack workflow run ID
        required: true
      release_tag:
        description: GitHub release tag containing the pack assets
        required: true
        default: "resources-v1"

permissions:
  actions: read
  contents: write

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  publish-manifest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download the already-built resource packs
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.source_run_id }}
          pattern: "*resource-pack"
          path: resource-dist
          merge-multiple: true
      - run: python -m pip install cryptography
      - name: Validate the complete catalog
        run: python scripts/validate_resource_packs.py resource-dist
      - name: Smoke-test packs with CPython Embedded
        shell: pwsh
        run: ./scripts/smoke_resource_packs.ps1 -PackDirectory resource-dist
      - name: Sign the current dependency graph
        env:
          SUBAI_RESOURCE_OWNER: ${{ github.repository_owner }}
          SUBAI_RESOURCE_SIGNING_KEY: ${{ secrets.SUBAI_RESOURCE_SIGNING_KEY }}
        run: python scripts/generate_resource_manifest.py resource-dist resource-dist/manifest-v2.json --tag '${{ inputs.release_tag }}'
      - name: Publish release assets and multipart archives
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view '${{ inputs.release_tag }}' --repo '${{ github.repository }}' *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create '${{ inputs.release_tag }}' --title '${{ inputs.release_tag }}' --notes 'Signed SubAI resource packs' --repo '${{ github.repository }}'
          }
          gh release upload '${{ inputs.release_tag }}' resource-dist/* --clobber --repo '${{ github.repository }}'
