name: Build resource packs

on:
  workflow_dispatch:
    inputs:
      version:
        description: Resource pack version
        required: true
        default: "1.0.0"
      release_tag:
        description: GitHub release tag
        required: true
        default: "resources-v1"

permissions:
  contents: write

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  runtime-packs:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        resource:
          - runtime:python:3.12
          - runtime:torch:cpu
          - runtime:torch:cuda
          - runtime:whisper:cpu
          - runtime:whisper:cuda
          - runtime:rapidocr:cpu
          - runtime:demucs
          - runtime:opus-mt
          - runtime:funasr
          - runtime:omnivoice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build pinned pack
        shell: pwsh
        run: ./scripts/build_resource_pack.ps1 -ResourceId '${{ matrix.resource }}' -Version '${{ inputs.version }}'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ strategy.job-index }}-resource-pack
          path: resource-dist/*.zip

  model-packs:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        resource:
          - ffmpeg
          - yt-dlp
          - whisper:tiny
          - whisper:base
          - whisper:small
          - whisper:medium
          - whisper:large-v3
          - rapidocr
          - demucs:htdemucs
          - demucs:htdemucs_ft
          - demucs:mdx_extra
          - demucs:htdemucs_6s
          - demucs:hdemucs_mmi
          - demucs:mdx
          - opus-mt
          - funasr:paraformer-zh
          - omnivoice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install huggingface-hub==0.33.2 modelscope==1.28.0
      - name: Build pinned model/tool pack
        run: python scripts/build_model_pack.py '${{ matrix.resource }}' '${{ inputs.version }}' resource-dist
      - uses: actions/upload-artifact@v4
        with:
          name: model-${{ strategy.job-index }}-resource-pack
          path: resource-dist/*.zip

  sign-and-publish:
    needs: [runtime-packs, model-packs]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: "*resource-pack"
          path: resource-dist
          merge-multiple: true
      - run: python -m pip install cryptography
      - name: Require a real pack for every Resource Center item
        run: python scripts/validate_resource_packs.py resource-dist
      - name: Smoke-test packs with CPython Embedded
        shell: pwsh
        run: ./scripts/smoke_resource_packs.ps1 -PackDirectory resource-dist
      - name: Sign manifest
        env:
          SUBAI_RESOURCE_OWNER: ${{ github.repository_owner }}
          SUBAI_RESOURCE_SIGNING_KEY: ${{ secrets.SUBAI_RESOURCE_SIGNING_KEY }}
        run: python scripts/generate_resource_manifest.py resource-dist resource-dist/manifest-v2.json --tag '${{ inputs.release_tag }}'
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ inputs.release_tag }}' resource-dist/* --title '${{ inputs.release_tag }}' --notes 'Signed SubAI resource packs' --repo '${{ github.repository }}'
